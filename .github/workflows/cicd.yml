name: ERP01 CI

on:
  push:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Django and PostgreSQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: erp_test
          POSTGRES_PASSWORD: erp_test
          POSTGRES_DB: erp_test
          TZ: Asia/Yangon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_test -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      PYTHONPATH: .
      DB_NAME: erp_test
      DB_USER: erp_test
      DB_PASSWORD: erp_test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django system checks
        run: python src/manage.py check
      - name: Apply migrations and verify model state
        run: |
          python src/manage.py migrate --noinput
          python src/manage.py makemigrations --check --dry-run
      - name: Run PostgreSQL test suite
        run: pytest -o addopts="" -q --ds=config.settings.ci
      - name: Security scan
        run: bandit -r src/ gateway/ modules/finance/ -q

  frontend:
    name: Frontend production builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build core ERP frontend
        working-directory: frontend
        run: npm run build
      - name: Build frontend with platform Finance UI
        working-directory: frontend
        env:
          VITE_PLATFORM_ENABLED: "true"
        run: npm run build

  containers:
    name: Container builds and Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Configure sample environment
        run: cp .env.example .env
      - name: Validate core Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate platform Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.platform.yml config --quiet
      - name: Build Django image
        run: docker build -t erp01-backend:ci .
      - name: Build core frontend image
        run: docker build -t erp01-frontend:ci ./frontend
      - name: Build gateway image
        run: docker build -t erp01-gateway:ci ./gateway
      - name: Build Finance image
        run: docker build -t erp01-finance:ci ./modules/finance
