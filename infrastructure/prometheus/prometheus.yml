global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: erp-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]

  - job_name: erp-finance
    metrics_path: /metrics
    static_configs:
      - targets: ["finance:8000"]

  - job_name: postgres
    metrics_path: /metrics
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    metrics_path: /metrics
    static_configs:
      - targets: ["redis-exporter:9121"]
