# Private-network Redis; the Compose stack does not publish port 6379.
bind 0.0.0.0
protected-mode yes
port 6379
tcp-keepalive 300
timeout 0
appendonly yes
appendfsync everysec
maxmemory 256mb
# Do not evict queue messages when Celery is introduced.
maxmemory-policy noeviction
slowlog-log-slower-than 10000
slowlog-max-len 128
