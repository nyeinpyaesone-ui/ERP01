# Optional ARIMA-style service layer on top of ERP01 Django.
# Start: docker compose -f docker-compose.yml -f docker-compose.platform.yml up -d --build
services:
  finance:
    build:
      context: ./modules/finance
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-erp_db}
      DB_USER: ${DB_USER:-erp_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env; must match Django}
      DB_POOL_MAX_SIZE: "10"
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    expose: ["8000"]
    networks: [erp-network]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GATEWAY_PORT: "8000"
      MODULES_ENABLED: ${MODULES_ENABLED:-inventory,sales,core,finance}
      REDIS_URL: redis://redis:6379/0
      SERVICE_INVENTORY_URL: http://web:8000/api/inventory
      SERVICE_INVENTORY_HEALTH_URL: http://web:8000/api/health/
      SERVICE_SALES_URL: http://web:8000/api/sales
      SERVICE_SALES_HEALTH_URL: http://web:8000/api/health/
      SERVICE_CORE_URL: http://web:8000/api
      SERVICE_CORE_HEALTH_URL: http://web:8000/api/health/
      SERVICE_FINANCE_URL: http://finance:8000/domains/finance
      SERVICE_FINANCE_HEALTH_URL: http://finance:8000/health
      ENABLE_API_DOCS: "false"
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8001}:8000"
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
      finance:
        condition: service_healthy
    networks: [erp-network]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_PLATFORM_ENABLED: "true"
    volumes:
      - ./frontend/nginx.platform.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/${DB_NAME:-erp_db}?sslmode=disable
      DATA_SOURCE_USER: ${DB_USER:-erp_user}
      DATA_SOURCE_PASS: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["9187"]
    networks: [erp-network]

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    command: ["--redis.addr=redis://redis:6379"]
    depends_on:
      redis:
        condition: service_healthy
    expose: ["9121"]
    networks: [erp-network]

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - gateway
      - finance
      - postgres-exporter
      - redis-exporter
    networks: [erp-network]

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks: [erp-network]

volumes:
  prometheus_data:
  grafana_data:
