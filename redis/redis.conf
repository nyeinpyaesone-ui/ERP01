# Redis is intentionally exposed only to the private Docker network.
bind 0.0.0.0
protected-mode yes
port 6379
tcp-keepalive 300
timeout 0
appendonly yes
appendfsync everysec
maxmemory 256mb
# Do not evict Celery queue data under memory pressure.
maxmemory-policy noeviction
slowlog-log-slower-than 10000
slowlog-max-len 128
